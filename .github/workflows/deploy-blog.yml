name: Deploy blog (blog.oruganti.dev)

on:
  push:
    branches: [main]
    paths:
      - "apps/blog/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-blog.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build blog
        run: npm run build --workspace=apps/blog

      # See deploy-site.yml for why this uses cloudflare/pages-action
      # instead of cloudflare/wrangler-action.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: oruganti-blog
          directory: apps/blog/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
