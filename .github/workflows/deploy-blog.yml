name: Deploy blog (blog.oruganti.dev)

on:
  push:
    branches: [main]
    paths:
      - "apps/blog/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-blog.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build blog
        run: npm run build --workspace=apps/blog

      # cloudflare/pages-action was removed from GitHub (Sep 2026: "Unable
      # to resolve action cloudflare/pages-action, not found"). That action
      # only ran `wrangler pages deploy` under the hood, so call the CLI
      # directly with the same arguments it used. --branch=main matches the
      # Pages project's production_branch (terraform/main.tf), which is what
      # makes the deployment the one served on the custom domain.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx --yes wrangler@4 pages deploy apps/blog/dist
          --project-name=oruganti-blog
          --branch=main
          --commit-hash=${{ github.sha }}
          --commit-dirty=true
