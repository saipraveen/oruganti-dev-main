name: Deploy site (oruganti.dev)

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-site.yml"
  repository_dispatch:
    types: [resume-updated]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build --workspace=apps/site

      # Pull the resume repo's latest static build output and place it at
      # /about/resume/ in this build. The resume repo (saipraveen/resume)
      # keeps its own independent GitHub Actions pipeline — this step only
      # reads its most recent successful build artifact, it never modifies
      # that repo. Requires a PAT with read access to that repo stored as
      # the RESUME_REPO_TOKEN secret (a fine-grained PAT scoped to
      # contents:read / actions:read on the resume repo is enough).
      - name: Fetch latest resume build
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.RESUME_REPO_TOKEN }}
          repo: saipraveen/resume
          workflow: release.yml
          branch: main
          name: resume-dist
          path: apps/site/dist/about/resume

      # Switched from cloudflare/wrangler-action to cloudflare/pages-action:
      # wrangler-action deploys were correctly tagged "Production" in
      # Cloudflare's dashboard (branch matched production_branch) but never
      # got promoted to the deployment actually served at the custom domain
      # / <project>.pages.dev — new deploys just sat alongside the old
      # active one indefinitely, and manually forcing promotion via the
      # dashboard's "Roll back to this deployment" also failed. pages-action
      # is the exact tool that reliably promoted deploys to production for
      # this same Cloudflare account previously (saipraveen/resume's old
      # release.yml, before this repo took over serving oruganti.dev).
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: oruganti-main
          directory: apps/site/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
